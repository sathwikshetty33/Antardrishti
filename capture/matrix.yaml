# experiment design (CLAUDE.md section 5). the plan built from this file with a
# given tier seed is fully deterministic.

seeds: {p0: 26001, p1: 26002, p2: 26003, p0s: 26004, avs: 26099, avp: 26099}

# per-run fixed cost (s) beyond the capture itself, measured on the phase 3
# acceptance runs: capture setup, zstd, tshark analysis, validation. the first
# run of a tunnel also deploys charon and initiates; heavy captures take longer
# to analyse (bulk is refined from a measured lan run).
overhead_s: {base: 10, tunnel_up: 5, video: 16, bulk: 45}

# one-time cost of a fresh shard codespace (estimate): bootstrap, image + media
# pull from ghcr, preflight, bringing up the labs
shard_setup_s: 600

defaults:
  ike_version: 2
  inner_family: same        # same as outer_family unless overridden
  esn: false
  replay_window: 32
  ike_rekey_s: 14400
  child_rekey_s: 3600
  dpd_delay_s: 0
  fragmentation: "yes"
  aggressive: false

# size-relevant cross: 2 modes x 4 esp wire shapes x 2 families x 2 encap = 32 configs.
# an esp wire shape fixes what is visible on the wire (iv, icv, block padding).
# the aes key size is invisible in esp, so it is not crossed: it is drawn per
# tunnel from the seed and recorded (config.esp_aes_bits).
set_a:
  mode: [tunnel, transport]
  esp: [gcm16, sha1, sha256, sha384]
  outer_family: [v4, v6]
  encap: [false, true]
  aes_bits: [128, 256]
  # free diversity, seeded per tunnel and recorded
  sample:
    dh: [ecp256, ecp384, curve25519, modp2048, modp3072]
    pfs: [true, false]
    auth: [psk, cert]
    cert_key: [rsa, ecdsa]
    ike_enc: [aes256-sha256, aes128-sha256, aes256-sha384, aes256gcm16-prfsha384]

# handshake cross: 5 x 2 x 2 = 20 configs, ikev2 only
set_b:
  dh: [modp1024, modp2048, ecp256, ecp384, curve25519]
  pfs: [true, false]
  auth: [psk, cert]
  cert_key_by_rep: [rsa, ecdsa, rsa]
  child_rekey_s: [40, 60]
  ike_rekey_s: [90, 120]
  sample:
    esp: [aes128gcm16, aes256gcm16, aes128-sha256, aes256-sha256]
    outer_family: [v4, v6]
    ike_enc: [aes256-sha256, aes128-sha256]

apps: [voip, video, web, email, icmp, bulk]

# tunnel reuse: the runs of one set-A config (one per app, or per combo) share a
# single tunnel. the tunnel comes up once; each app still gets its own run and
# capture. the first run of a tunnel is before_tunnel (captures ike setup), the
# rest are mid_stream (capture starts on the established tunnel: no ike, and
# esp sequence numbers continue from the earlier runs).
randomize:
  min_mid_stream: 0.15       # checked: share of mid_stream traffic runs
  noise: 0.5

tiers:
  p0:
    - {stage: traffic, set: a, apps: [voip, video, web, email, icmp, bulk], reps: 1, duration_s: 90}
    # 2 extra short tunnels per set-A config (ping + light web, light lane): more
    # tunnels, each with its own ike setup and drawn dh/pfs/auth/key size, for the
    # config models
    - {stage: short, set: a, apps: [icmp, web_light], reps: 2, duration_s: 120}
    - {stage: handshake, set: b, apps: [icmp, web_light], reps: 3, duration_s: 150}
    - {stage: edge, level: p0, reps: 3}
  p0s:
    # the 192 p0 traffic runs recaptured alone on the machine (--labs 1, timing_valid;
    # owner, 2026-09-28). like: p0 makes each run a paired twin of its p0 run
    # (recapture_of): the same tunnel config, app, app order, split, netem, noise and
    # capture_start; only the run seed (p0s's own) and the capture concurrency differ
    - {stage: traffic, set: a, apps: [voip, video, web, email, icmp, bulk], reps: 1, duration_s: 90, like: p0}
  p1:
    # every p1 traffic stage (mixtures, anchor, chat, whatsapp, realism) is captured
    # alone on its machine (--labs 1) and recorded timing_valid; p1 edge cases are not
    - stage: mixtures
      set: a8
      duration_s: 90
      reps: 1
      combos:
        - [voip, video]
        - [voip, web]
        - [video, web]
        - [web, email]
        - [voip, bulk]
        - [video, bulk]
        - [icmp, web]
        - [chat, web]
        - [email, bulk]
        - [voip, video, web]
    # timing-valid anchors: the six single apps on the mixtures' 8 configs (p0
    # traffic was captured with 3 parallel labs, so its timing is biased)
    - {stage: anchor, set: a8, apps: [voip, video, web, email, icmp, bulk], reps: 1, duration_s: 60}
    - {stage: chat, set: a, apps: [chat], reps: 1, duration_s: 60}
    - {stage: whatsapp, set: a_tunnel, apps: [whatsapp], reps: 1, duration_s: 90, needs: external/whatsapp}
    - {stage: realism, set: inet8, apps: [web, youtube], reps: 1, duration_s: 90}
    - {stage: edge, level: p1, reps: 3}
  p2:
    - {stage: traffic, set: a, apps: [voip, video, web, email, icmp, bulk], reps: 1, rep_offset: 1, duration_s: 90}
    - {stage: public, set: a_tunnel, apps: [public], reps: 1, duration_s: 90, needs: external/public}

  # adversarial validation of parallel labs (tools/advval.py), not part of the
  # dataset: the same target runs serially (avs, --labs 1) and at full
  # parallelism (avp, --labs 3, next to light filler runs). one seed for both,
  # so every avs run has a twin in avp with the same config, netem and app seed
  avs:
    - {stage: av, set: av3, apps: [voip, web, video], reps: 3, duration_s: 90}
  avp:
    - {stage: av, set: av3, apps: [voip, web, video], reps: 3, duration_s: 90}
    - {stage: avfill, set: a, apps: [email, icmp], reps: 1, duration_s: 90}

# subsets of set a (same esp wire shapes; key size drawn per tunnel)
subsets:
  # one config per esp wire shape x mode -> 4 x 2 = 8. family and nat-t rotate as
  # for the test tunnels: the two modes of a shape get opposite family and nat-t,
  # and every (family, nat-t) combination is used twice
  a8: {mode: [tunnel, transport], esp: [gcm16, sha1, sha256, sha384], outer_family: [v4, v6], encap: [false, true], pick: [0, 5, 11, 14, 19, 22, 24, 29]}
  # replay (tcpreplay injects raw frames, which bypass xfrm, so it can only
  # enter the tunnel from host_a through gw_a): tunnel only -> 4 x 2 x 2 = 16.
  # inner is v4: the captures are v4 and tcprewrite cannot map v4 to v6
  a_tunnel: {mode: [tunnel], esp: [gcm16, sha1, sha256, sha384], outer_family: [v4, v6], encap: [false, true], inner_family: v4}
  # adversarial validation: 3 set-A configs spanning both modes, both families,
  # gcm and cbc, with and without nat-t
  av3: {mode: [tunnel, transport], esp: [gcm16, sha256], outer_family: [v4, v6], encap: [false, true], pick: [0, 7, 13]}
  # tunnel to the real internet, 4 esp x 2 outer families = 8
  inet8: {mode: [tunnel], esp: [gcm16, sha1, sha256, sha384], outer_family: [v4, v6], encap: [false], inner_family: v4}
