user www-data;
worker_processes 2;
pid /run/nginx.pid;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  types { application/vnd.apple.mpegurl m3u8; video/mp2t ts; video/mp4 m4s; }
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    ssl_certificate /etc/lab/tls/cert.pem;
    ssl_certificate_key /etc/lab/tls/key.pem;
    root /srv/media;
    location /bulk/ { alias /srv/bulk/; }
    location = /player.html { alias /etc/lab/conf/player.html; }
    location /hls/ { add_header Cache-Control no-cache; }
    location / { try_files $uri $uri/index.html $uri.html =404; }
  }
}
