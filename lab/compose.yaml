# antardrishti lab topology (one lab; several can run side by side)
#
# host_a -- lan_a -- gw_a -- wan_a -- router -- wan_b -- gw_b -- lan_b -- host_b
#                              |                  |         \
#                           noise_a            noise_b       inet (nat, realism tier only)
#
# links are not docker networks: lab/topo.py wires veth pairs into bridges in a
# per-lab switch namespace, so every lab has the same addresses (see topo.links).
# cli_gw / svc_gw share the network namespace of gw_a / gw_b and carry the same
# client / service images as host_a / host_b, for transport mode.
# ANTAR_PREFIX (antar0, antar1, ...) and ANTAR_INET are set by lab/topo.py.
name: ${ANTAR_PREFIX:-antar0}

x-lab: &lab
  privileged: true
  cap_add: [NET_ADMIN]
  init: true
  restart: "no"
  sysctls:
    net.ipv6.conf.all.disable_ipv6: 0
    net.ipv6.conf.default.disable_ipv6: 0
    net.ipv4.ip_forward: 1
    net.ipv6.conf.all.forwarding: 1

services:
  gw_a:
    <<: *lab
    image: antar/gw
    build: images/gw
    container_name: ${ANTAR_PREFIX:-antar0}_gw_a
    network_mode: none
    hostname: gw-a

  gw_b:
    <<: *lab
    image: antar/gw
    container_name: ${ANTAR_PREFIX:-antar0}_gw_b
    hostname: gw-b
    networks: [inet]

  router:
    <<: *lab
    image: antar/router
    build: images/router
    container_name: ${ANTAR_PREFIX:-antar0}_router
    network_mode: none
    hostname: router

  host_a:
    <<: *lab
    image: antar/host
    build: images/host
    container_name: ${ANTAR_PREFIX:-antar0}_host_a
    network_mode: none
    hostname: host-a
    shm_size: 1gb
    volumes: ["../gen:/gen:ro", "../dataset/external:/external:ro"]

  host_b:
    <<: *lab
    image: antar/services
    build: images/services
    container_name: ${ANTAR_PREFIX:-antar0}_host_b
    network_mode: none
    hostname: host-b
    volumes: ["../gen:/gen:ro", "../dataset/external:/external:ro", "./media:/srv/media:ro"]

  cli_gw:
    <<: *lab
    image: antar/host
    container_name: ${ANTAR_PREFIX:-antar0}_cli_gw
    shm_size: 1gb
    volumes: ["../gen:/gen:ro", "../dataset/external:/external:ro"]
    network_mode: "service:gw_a"
    sysctls: {}
    depends_on: [gw_a]

  svc_gw:
    <<: *lab
    image: antar/services
    container_name: ${ANTAR_PREFIX:-antar0}_svc_gw
    volumes: ["../gen:/gen:ro", "../dataset/external:/external:ro", "./media:/srv/media:ro"]
    network_mode: "service:gw_b"
    sysctls: {}
    depends_on: [gw_b]

  noise_a:
    <<: *lab
    image: antar/noise
    build: images/noise
    container_name: ${ANTAR_PREFIX:-antar0}_noise_a
    network_mode: none
    hostname: noise-a

  noise_b:
    <<: *lab
    image: antar/noise
    container_name: ${ANTAR_PREFIX:-antar0}_noise_b
    network_mode: none
    hostname: noise-b
    command: ["/serve.sh"]

  # e18 only (profile multi): extra initiators toward gw_b. gw_c sits directly
  # on wan_a; gw_d and gw_e share one masquerading nat box.
  gw_c:
    <<: *lab
    image: antar/gw
    container_name: ${ANTAR_PREFIX:-antar0}_gw_c
    network_mode: none
    hostname: gw-c
    profiles: [multi]

  nat_n:
    <<: *lab
    image: antar/router
    container_name: ${ANTAR_PREFIX:-antar0}_nat_n
    network_mode: none
    hostname: nat-n
    profiles: [multi]

  gw_d:
    <<: *lab
    image: antar/gw
    container_name: ${ANTAR_PREFIX:-antar0}_gw_d
    network_mode: none
    hostname: gw-d
    profiles: [multi]

  gw_e:
    <<: *lab
    image: antar/gw
    container_name: ${ANTAR_PREFIX:-antar0}_gw_e
    network_mode: none
    hostname: gw-e
    profiles: [multi]

networks:
  inet:
    ipam: {config: [{subnet: "${ANTAR_INET:-192.168.100.0/24}"}]}
