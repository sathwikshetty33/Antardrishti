# alembic for the antardrishti platform. run from the repository root:
#   alembic -c app/alembic.ini upgrade head
# DATABASE_URL (or DATABASE_URL_UNPOOLED for neon's direct connection) comes from the
# environment, never from this file.
[alembic]
script_location = app/api/migrations
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
